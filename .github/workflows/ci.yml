name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json engines is >=18 and there is no .nvmrc.
          # Node 22 is the current LTS line the suite was verified on.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Local throwaway service only. No Supabase project and no secrets.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PGSSLMODE: disable
